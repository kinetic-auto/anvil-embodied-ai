# ROS2 MCAP replay evaluation.
#
# Do NOT use this for live robot control. The inference YAML remaps action
# output topics to /eval/* so GT actions from MCAP replay can coexist.
#
# ---------------------------------------------------------------------------
# Interactive — same pattern as docker-compose.train.yml
# ---------------------------------------------------------------------------
#   mkdir -p eval_results/car-door-opening-20260910/act-chunk50-aug/last/ros
#   docker compose -f docker-compose.eval.yml up --build
#   docker exec -it anvil-eval bash
#
# Stop anvil-train first if it is holding the GPUs.
#
# Write eval_plan.json in the mounted output dir, then start the three nodes
# in separate shells (or background). Paths below are as seen IN the container.
#
#   ros2 launch lerobot_control inference.launch.py \
#     model_path:=/workspace/model \
#     config_file:=/workspace/config.yaml \
#     control_frequency:=60.0
#
#   ros2 run lerobot_control mcap_player_node --ros-args \
#     -p eval_plan_file:=/workspace/eval_results/eval_plan.json \
#     -p warmup_sec:=5.0 \
#     -p inter_episode_sec:=1.0 \
#     -p ack_timeout_sec:=20.0
#
#   ros2 run lerobot_control eval_recorder_node --ros-args \
#     -p output_dir:=/workspace/eval_results \
#     -p inference_drain_sec:=1.5 \
#     -p silence_timeout_sec:=1.0 \
#     -p gt_topics:=["/follower_r_forward_position_controller/commands"] \
#     -p pred_topics:=["/eval/follower_r_forward_position_controller/commands"] \
#     -p arm_names:=["right"] \
#     -p use_delta_actions:=false \
#     -p dataset_fps:=60.0
#
# eval_plan.json uses host MCAP paths; the player remaps them to
# /workspace/mcap_data. Episode indices in split_info.json are DATASET
# indices (skipped bags 0020/0034/0035 are already gone). Map those to
# the original folders before writing mcap_path:
#   ds 0-18  → 0001-0019
#   ds 19-31 → 0021-0033
#   ds 32-36 → 0036-0040
# Val for this job: ds 4,5,17,29 → 0005, 0006, 0018, 0031
#
# ---------------------------------------------------------------------------
# Auto stack — anvil-eval-ros / --profile stack
# ---------------------------------------------------------------------------
#   docker compose -f docker-compose.eval.yml --profile stack up --build \
#     --abort-on-container-exit --exit-code-from eval-recorder
#
# Optional env overrides:
#   ROS_DOMAIN_ID, IMAGE_TAG, HF_CACHE
#   EVAL_WARMUP_SEC, EVAL_DRAIN_SEC, EVAL_INTER_EPISODE_SEC
#   EVAL_SILENCE_TIMEOUT_SEC, EVAL_ACK_TIMEOUT_SEC
#   INFERENCE_CONFIG_FILE, EVAL_GT_TOPICS, EVAL_PRED_TOPICS, EVAL_ARM_NAMES
#   EVAL_USE_DELTA_ACTIONS, EVAL_ACTION_TYPE, EVAL_DELTA_EXCLUDE_JOINTS
#   EVAL_DATASET_FPS, CONTROL_FREQ, MONITOR_ENABLE, MONITOR_OUTPUT_DIR
#   MODEL_PATH, MCAP_ROOT, OUTPUT_DIR, EVAL_PLAN_FILE

x-base: &base
  # Built locally from docker/inference/Dockerfile (ROS2 Jazzy + lerobot + lerobot_control).
  # Not pulled from GHCR — that tag is not published for this machine.
  image: anvil-robot-eval:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: docker/inference/Dockerfile
    args:
      LEROBOT_VERSION: ${LEROBOT_VERSION:-0.5.1}
      LEROBOT_EXTRAS: ${LEROBOT_EXTRAS:-}
  networks:
    - ros2_eval
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
    - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    - CYCLONEDDS_URI=file:///workspace/configs/cyclonedds/test_bridge.xml
  volumes:
    - ./configs:/workspace/configs:ro

services:

  # ── Interactive workspace (default `docker compose up`) ─────────────────
  eval:
    <<: *base
    container_name: anvil-eval
    stdin_open: true
    tty: true
    working_dir: /workspace
    volumes:
      - ${MODEL_PATH:-./model_zoo/car-door-opening-20260910/act-chunk50-aug/checkpoints/last}:/workspace/model:ro
      - ${INFERENCE_CONFIG_FILE:-./configs/lerobot_control/inference_eval_openyam_single.yaml}:/workspace/config.yaml:ro
      - ${MCAP_ROOT:-/var/tmp/anvil-robot/data/recordings/car-door-opening-20260910}:/workspace/mcap_data:ro
      - ${OUTPUT_DIR:-./eval_results/car-door-opening-20260910/act-chunk50-aug/last/ros}:/workspace/eval_results
      - ./packages/anvil_eval/src:/workspace/anvil_eval_src:ro
      - ${HF_CACHE:-.docker_empty_hf_cache}:/root/.cache/huggingface
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///workspace/configs/cyclonedds/test_bridge.xml
      - ANVIL_EVAL_PATH=/workspace/anvil_eval_src
      - MONITOR_ENABLE=${MONITOR_ENABLE:-false}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: bash

  # ── Auto stack (profile: stack) — used by anvil-eval-ros ────────────────
  inference:
    <<: *base
    profiles:
      - stack
    container_name: lerobot-eval-inference
    volumes:
      - ${MODEL_PATH:-./model_zoo/car-door-opening-20260910/act-chunk50-aug/checkpoints/last}:/workspace/model:ro
      - ${INFERENCE_CONFIG_FILE:-./configs/lerobot_control/inference_eval_openyam_single.yaml}:/workspace/config.yaml:ro
      - ${HF_CACHE:-.docker_empty_hf_cache}:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///workspace/configs/cyclonedds/test_bridge.xml
      - MONITOR_ENABLE=${MONITOR_ENABLE:-false}
    command: >
      ros2 launch lerobot_control inference.launch.py
        model_path:=/workspace/model
        config_file:=/workspace/config.yaml
        monitor_enable:=${MONITOR_ENABLE:-false}
        control_frequency:=${CONTROL_FREQ:-60.0}

  inference-monitor:
    <<: *base
    container_name: lerobot-eval-monitor
    profiles:
      - monitor
    depends_on:
      - inference
    volumes:
      - ${MONITOR_OUTPUT_DIR:-/tmp/monitor_output}:/workspace/monitor_output
    command: >
      ros2 run lerobot_control inference_monitor_node
        --ros-args
        -p output_dir:=/workspace/monitor_output

  mcap-player:
    <<: *base
    profiles:
      - stack
    container_name: lerobot-eval-player
    volumes:
      - ${MCAP_ROOT:-/var/tmp/anvil-robot/data/recordings/car-door-opening-20260910}:/workspace/mcap_data:ro
      - ${EVAL_PLAN_FILE:-./eval_results/car-door-opening-20260910/act-chunk50-aug/last/ros/eval_plan.json}:/workspace/eval_plan.json:ro
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///workspace/configs/cyclonedds/test_bridge.xml
      - EVAL_WARMUP_SEC=${EVAL_WARMUP_SEC:-5}
      - EVAL_INTER_EPISODE_SEC=${EVAL_INTER_EPISODE_SEC:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f mcap_player_node > /dev/null"]
      start_period: 8s
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      inference:
        condition: service_started
    command: >
      ros2 run lerobot_control mcap_player_node
        --ros-args
        -p eval_plan_file:=/workspace/eval_plan.json
        -p warmup_sec:=${EVAL_WARMUP_SEC:-5.0}
        -p inter_episode_sec:=${EVAL_INTER_EPISODE_SEC:-1.0}
        -p ack_timeout_sec:=${EVAL_ACK_TIMEOUT_SEC:-20.0}

  eval-recorder:
    <<: *base
    profiles:
      - stack
    container_name: lerobot-eval-recorder
    volumes:
      - ${OUTPUT_DIR:-./eval_results/car-door-opening-20260910/act-chunk50-aug/last/ros}:/workspace/eval_results
      - ./packages/anvil_eval/src:/workspace/anvil_eval_src:ro
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///workspace/configs/cyclonedds/test_bridge.xml
      - ANVIL_EVAL_PATH=/workspace/anvil_eval_src
      - EVAL_DRAIN_SEC=${EVAL_DRAIN_SEC:-1.5}
      - EVAL_SILENCE_TIMEOUT_SEC=${EVAL_SILENCE_TIMEOUT_SEC:-1.0}
    depends_on:
      mcap-player:
        condition: service_healthy
    command: >
      ros2 run lerobot_control eval_recorder_node
        --ros-args
        -p output_dir:=/workspace/eval_results
        -p inference_drain_sec:=${EVAL_DRAIN_SEC:-1.5}
        -p silence_timeout_sec:=${EVAL_SILENCE_TIMEOUT_SEC:-1.0}
        -p gt_topics:=${EVAL_GT_TOPICS:-["/follower_r_forward_position_controller/commands"]}
        -p pred_topics:=${EVAL_PRED_TOPICS:-["/eval/follower_r_forward_position_controller/commands"]}
        -p arm_names:=${EVAL_ARM_NAMES:-["right"]}
        -p use_delta_actions:=${EVAL_USE_DELTA_ACTIONS:-false}
        -p action_type:=${EVAL_ACTION_TYPE:-delta_obs_t}
        -p dataset_fps:=${EVAL_DATASET_FPS:-60.0}
        -p delta_exclude_joints:=${EVAL_DELTA_EXCLUDE_JOINTS:-[]}

networks:
  ros2_eval:
    driver: bridge
