# =============================================================================
# LeRobot Inference Configuration — OpenYam single-arm Quest (right, 7-DoF)
# =============================================================================
# Use this for models trained from openyam_single_quest.yaml (21-dim packed).
# The stock inference_eval.yaml is bimanual 8+8 with joint7 and /cam_waist.
#
# Parameters set via ROS2 launch args (not in this file):
#   model_path, device, control_frequency, image_height/width, echo_topic_only

# -----------------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------------
model:
  # VLA task prompt — required for SmolVLA / Pi0 / Pi0.5, ignored for ACT / Diffusion
  task_description: null

# -----------------------------------------------------------------------------
# Inference Tuning (per model type)
# -----------------------------------------------------------------------------
inference_tuning:

  act:
    # null = use the checkpoint (this ACT job trained with n_action_steps=50)
    n_action_steps: null
    temporal_ensemble_coeff: null

  diffusion:
    n_action_steps: null
    num_inference_steps: 10

  rtc:
    inference_delay: 10
    queue_trigger_threshold: 50
    execution_horizon: 12
    max_guidance_weight: 10.0
    prefix_attention_schedule: EXP

# -----------------------------------------------------------------------------
# Joint Configuration
# -----------------------------------------------------------------------------
joint_state_topic: "/joint_states"

joint_names:
  # Matches observation.state / action names from conversion (no joint7)
  model_joint_order:
    - finger_joint1
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6

  # Order in Float64MultiArray on the forward_position_controller topic
  controller_joint_order:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - finger_joint1

  arm_mapping:
    r: right

  # Packed 21-dim observation.state: [pos×7 | vel×7 | eff×7] in model_joint_order.
  # action_start / action_end stay 0 / 7 — block layout puts positions first.
  state_features:
    - position
    - velocity
    - effort
  state_layout: packed

# -----------------------------------------------------------------------------
# Arm Configuration — REMAPPED for eval
# -----------------------------------------------------------------------------
arms:
  right:
    ros_prefix: "follower_r"
    command_topic: "/eval/follower_r_forward_position_controller/commands"
    action_start: 0
    action_end: 7

# -----------------------------------------------------------------------------
# Camera Configuration
# -----------------------------------------------------------------------------
cameras:
  fps: 60.0

  mapping:
    "/cam_chest/image_raw/compressed": "chest"
    "/cam_wrist_r/image_raw/compressed": "wrist_r"
    "/cam_wrist_l/image_raw/compressed": "wrist_l"
