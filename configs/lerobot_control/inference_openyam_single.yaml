# =============================================================================
# LeRobot Inference Configuration — OpenYam single-arm Quest (right, 7-DoF)
# =============================================================================
# Live robot. Commands go to the real forward_position_controller.
# For MCAP eval (no motion), use inference_eval_openyam_single.yaml instead.

model:
  task_description: null

inference_tuning:

  act:
    # Must be <= chunk_size (50). Lower = re-infer more often (faster reaction, more jitter).
    n_action_steps: 50
    temporal_ensemble_coeff: null

  diffusion:
    n_action_steps: null
    num_inference_steps: 10

  rtc:
    inference_delay: 10
    queue_trigger_threshold: 50
    execution_horizon: 12
    max_guidance_weight: 10.0
    prefix_attention_schedule: EXP

joint_state_topic: "/joint_states"

joint_names:
  model_joint_order:
    - finger_joint1
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6

  controller_joint_order:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - finger_joint1

  arm_mapping:
    r: right

  state_features:
    - position

arms:
  right:
    ros_prefix: "follower_r"
    command_topic: "/follower_r_forward_position_controller/commands"
    action_start: 0
    action_end: 7

cameras:
  fps: 60.0

  mapping:
    "/cam_chest/image_raw/compressed": "chest"
    "/cam_wrist_r/image_raw/compressed": "wrist_r"
    "/cam_wrist_l/image_raw/compressed": "wrist_l"
