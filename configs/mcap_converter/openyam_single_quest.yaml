# =============================================================================
# OpenArm MCAP to LeRobot Conversion Configuration
# =============================================================================
# Teleop Mode: Quest (VR Controller) — SINGLE ARM (right only)
# Packed 21-dim observation.state and action:
#   [position × 7 | velocity × 7 | effort × 7]
# in canonical joint order (finger_joint1, joint1..joint6).
#
# Action is observation shifted by action_from_observation_n (default 10,
# ≈167 ms at 60 fps). Command topics in this file are ignored.
# =============================================================================

robot_state_topic: "/joint_states"


# =============================================================================
# Joint Name Parsing
# =============================================================================
# /joint_states has follower joints only:
#   "follower_r_joint1", "follower_r_finger_joint1", etc.

joint_names:
  separator: "_"

  source:
    follower: observation

  arms:
    r: right


# =============================================================================
# Action Topics (Quest Teleop)
# =============================================================================
# Kept for parity with other quest configs. action_from_observation: true
# ignores these topics; convert prints an [ACTION SOURCE] notice.

action_topics:
  "/follower_r_forward_position_controller/commands":
    arm: "right"
    joint_order: ["joint1", "joint2", "joint3", "joint4", "joint5", "joint6", "finger_joint1"]

action_from_observation: true
# action[t] = observation[t + n]. 10 ≈ 167 ms at 60 fps.
action_from_observation_n: 10


# =============================================================================
# Camera Configuration
# =============================================================================

camera_topics:
  - "/cam_chest/image_raw/compressed"
  - "/cam_wrist_r/image_raw/compressed"
  - "/cam_wrist_l/image_raw/compressed"

# First mapping is the time-base camera.
camera_topic_mapping:
  "/cam_chest/image_raw/compressed": "chest"
  "/cam_wrist_r/image_raw/compressed": "wrist_r"
  "/cam_wrist_l/image_raw/compressed": "wrist_l"

image_resolution: [640, 480]


# =============================================================================
# Feature Extraction — packed into observation.state / action
# =============================================================================

observation_feature_mapping:
  state: ["position", "velocity", "effort"]
  others: []

action_feature_mapping:
  state: ["position", "velocity", "effort"]
  others: []
